<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThumbScore Settings</title>
    <link rel="stylesheet" href="./pico.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="header-container">
        <div class="logo">👎</div>
        <h1>ThumbScore</h1>
        <div class="subtitle"><a href="https://bittu.dev" class="secondary">by Bittu</a></div>
    </div>

    <div class="quick-links">
        <a href="https://thumbscore.bittu.dev" target="_blank">Website</a>
        <a href="https://www.patreon.com/cw/LazyBittu" target="_blank" class="highlight">Donate</a>
        <a href="https://discord.gg/CZdNvKaNNr" target="_blank">Discord</a>
    </div>

    <hr>

    <main class="container">

        <div class="setting-group">
            <label for="scoringSystem" class="setting-label">Score Format</label>
            <select id="scoringSystem" required>
                <option value="percentage" selected>Percentage (55%)</option>
                <option value="decimal">10 Point Decimal (5.5/10)</option>
                <option value="point">10 Poin(5/10)</option>
                <option value="star">5 Star (3/5)</option>
                <option value="smiley">3 Point Smiley :)</option>
            </select>

            <div class="setting-row">
                <span class="setting-label">Coloured Scores</span>
                <input type="checkbox" id="scoringColour" role="switch" checked>
            </div>

            <div class="setting-row">
                <span class="setting-label">Hide Low Score Videos</span>
                <input type="checkbox" id="hideLowScore" role="switch">
            </div>

            <div id="thresholdWrapper" class="threshold-container">
                <div class="threshold-header">
                    <span class="setting-label">Low Score Threshold</span>
                    <strong id="thresholdValue" style="color: #ff9b9b;">20%</strong>
                </div>
                <input type="range" id="lowScoreThreshold" min="0" max="100" value="20">
            </div>

            <div class="setting-row">
                <span class="setting-label">Cache Sharing</span>
                <input type="checkbox" id="cacheSharing" role="switch">
            </div>
            <small id="cacheNote" class="hidden"
                style="display:block; color: #a58e8b; margin-top: -0.5rem; margin-bottom: 1rem;">
                Note: your browser will connect to a p2p swarm and share the cache with other users to improve performace.
            </small>


            <div class="version-tag">v1.0.0</div>
    </main>

    <script src="main.js"></script>
</body>

</html>
